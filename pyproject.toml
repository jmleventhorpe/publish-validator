[project]
name = "publish-validator"
version = "0.1.0"
description = "Extensible publish sanity checker for Blender, Maya, Houdini and any host that runs Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
publish-validator = "publish_validator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publish_validator"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Docs use hand-aligned comments in code examples.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Checks are declared with set/list class attributes on purpose (hosts = {"blender"}).
ignore = ["RUF012"]
