[project]
name = "publish-validator"
version = "0.2.0"
description = "Extensible pre-publish checks for 3D assets, with a native Blender panel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "James Leventhorpe" }]
keywords = ["blender", "vfx", "pipeline", "validation", "publish", "usd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Repository = "https://github.com/jmleventhorpe/publish-validator"
Issues = "https://github.com/jmleventhorpe/publish-validator/issues"

[project.scripts]
publish-validator = "publish_validator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publish_validator"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# Docs use hand-aligned comments in code examples.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Checks are declared with set/list class attributes on purpose (hosts = {"blender"}).
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# __init__ files re-export names on purpose.
"__init__.py" = ["F401"]
